<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WeatherHub - Live Weather</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-900 to-indigo-900 min-h-screen text-white">
  <div class="max-w-4xl mx-auto p-6">
    <header class="text-center mb-8">
      <h1 class="text-5xl font-bold flex items-center justify-center gap-3">
        <i class="fas fa-cloud-sun"></i> WeatherHub
      </h1>
      <p class="text-blue-200 mt-2">Real-time weather from Open-Meteo API</p>
    </header>

    <!-- Search -->
    <div class="max-w-md mx-auto mb-10">
      <div class="relative">
        <input 
          type="text" 
          id="cityInput"
          placeholder="Search city (e.g. Mumbai, London, Tokyo)"
          class="w-full px-6 py-4 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 focus:outline-none focus:border-white/50 text-lg placeholder-gray-300"
        />
        <button onclick="searchWeather()" 
          class="absolute right-3 top-1/2 -translate-y-1/2 bg-blue-600 hover:bg-blue-700 px-8 py-3 rounded-xl font-medium transition">
          Search
        </button>
      </div>
    </div>

    <!-- Weather Card -->
    <div id="weatherCard" class="hidden bg-white/10 backdrop-blur-lg rounded-3xl p-8 shadow-2xl border border-white/20">
      <div class="flex justify-between items-start">
        <div>
          <h2 id="cityName" class="text-4xl font-semibold"></h2>
          <p id="date" class="text-blue-200"></p>
        </div>
        <div id="currentTemp" class="text-7xl font-light"></div>
      </div>

      <div class="flex items-center gap-6 mt-8">
        <img id="weatherIcon" src="" alt="weather" class="w-24 h-24"/>
        <div>
          <p id="condition" class="text-2xl capitalize"></p>
          <p id="description" class="text-blue-200"></p>
        </div>
      </div>

      <!-- Details -->
      <div class="grid grid-cols-3 gap-6 mt-10">
        <div class="bg-white/10 rounded-2xl p-5 text-center">
          <i class="fas fa-wind text-2xl mb-2"></i>
          <p class="text-sm text-blue-200">Wind</p>
          <p id="wind" class="text-2xl font-semibold"></p>
        </div>
        <div class="bg-white/10 rounded-2xl p-5 text-center">
          <i class="fas fa-tint text-2xl mb-2"></i>
          <p class="text-sm text-blue-200">Humidity</p>
          <p id="humidity" class="text-2xl font-semibold"></p>
        </div>
        <div class="bg-white/10 rounded-2xl p-5 text-center">
          <i class="fas fa-eye text-2xl mb-2"></i>
          <p class="text-sm text-blue-200">Visibility</p>
          <p id="visibility" class="text-2xl font-semibold"></p>
        </div>
      </div>
    </div>

    <div id="error" class="hidden text-center text-red-400 mt-6"></div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
